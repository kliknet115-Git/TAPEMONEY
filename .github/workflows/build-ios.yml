name: Build TAPEMONEY iOS IPA

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Memungkinkan trigger manual dari tombol GitHub Actions

jobs:
  build-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-14 # macOS runner dengan chip Apple Silicon & Xcode 15+

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pilih Versi Xcode
        run: |
          echo "Daftar Xcode yang tersedia:"
          ls -d /Applications/Xcode*
          sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Build TAPEMONEY App (Release)
        run: |
          set -e
          xcodebuild -project TAPEMONEY.xcodeproj \
            -scheme TAPEMONEY \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Kemas Menjadi Berkas .ipa
        run: |
          set -e
          mkdir -p build/Payload
          
          # Salin TAPEMONEY.app ke folder Payload
          APP_PATH=$(find build/DerivedData -name "TAPEMONEY.app" -type d | head -n 1)
          echo "Menemukan App di: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          
          # Zip Payload menjadi file .ipa
          cd build
          zip -qr TAPEMONEY.ipa Payload
          ls -lh TAPEMONEY.ipa
          cd ..

      - name: Unggah Artefak TAPEMONEY.ipa
        uses: actions/upload-artifact@v4
        with:
          name: TAPEMONEY-iOS-IPA
          path: build/TAPEMONEY.ipa
          retention-days: 14

name: Build TAPEMONEY iOS IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Info Versi Xcode
        run: xcodebuild -version

      - name: Build TAPEMONEY App
        run: |
          set -e
          xcodebuild -project TAPEMONEY.xcodeproj \
            -target TAPEMONEY \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Kemas Menjadi Berkas IPA
        run: |
          set -e
          mkdir -p build/Payload
          APP_PATH=$(find build -name "TAPEMONEY.app" -type d | head -n 1)
          echo "Menemukan App di: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr TAPEMONEY.ipa Payload
          cd ..

      - name: Unggah Artefak TAPEMONEY.ipa
        uses: actions/upload-artifact@v4
        with:
          name: TAPEMONEY-iOS-IPA
          path: build/TAPEMONEY.ipa
          retention-days: 14
